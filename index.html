<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="8b Cooking">
<meta name="theme-color" content="#2aa6a0">
<meta name="description" content="Learn food words and cook meals in a 3D kitchen – an English lesson for class 8b.">
<title>Mr Fuhs' great cooking lesson for 8b</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="homeBtn" class="icon-btn" aria-label="Home">🏠</button>
    <div class="brand"><span class="brand-hat">👩‍🍳</span><span class="brand-txt">Mr Fuhs' great cooking lesson for <b>8b</b></span></div>
    <div class="clock" aria-label="Kitchen clock"><span>🕔</span><span id="clockTxt">17:30</span></div>
    <div class="speed" id="topSpeed" role="group" aria-label="Time speed"></div>
    <button id="readBtn" class="icon-btn" aria-label="Read aloud on/off">🗣️</button>
    <button id="soundBtn" class="icon-btn" aria-label="Sound on/off">🔊</button>
  </header>

  <main id="stage">
    <canvas id="c"></canvas>
    <div id="recipeCard" class="card hidden"></div>
    <div id="toast" class="toast"></div>
    <div id="stepCard" class="card hidden"></div>
    <div id="loading"><div class="spinner"></div>Setting up the kitchen…</div>
  </main>

  <aside id="panel">
    <div class="panel-head">
      <h2>Ingredients</h2>
      <label class="switch"><input type="checkbox" id="wordsToggle" checked><span class="sw"></span><span class="sw-label">Words</span></label>
    </div>
    <div class="legend"><b class="plus">+</b> new words</div>
    <div id="tiles"></div>
  </aside>
</div>

<div id="overlay" class="overlay hidden"><div id="overlayCard" class="ov-card"></div></div>

<noscript><p style="padding:2rem;font-family:sans-serif">Please turn on JavaScript to cook. 🍳</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
